name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: Build the SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - run: bun run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  binaries:
    name: Compile notam-${{ matrix.target }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # The same SPA in all four binaries, byte for byte.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # `${GITHUB_REF_NAME#v}` — the tag v0.1.0 makes `notam version` print 0.1.0.
      - name: Compile
        run: |
          bun run scripts/build-binary.ts \
            --target "${{ matrix.target }}" \
            --version "${GITHUB_REF_NAME#v}"

      - name: Check it reports the tagged version
        if: matrix.target == 'linux-x64'
        run: |
          printed=$(./dist/notam-linux-x64 version)
          expected="${GITHUB_REF_NAME#v}"
          test "$printed" = "$expected" || {
            echo "notam version printed '$printed', expected '$expected'" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: notam-${{ matrix.target }}
          path: dist/notam-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish the release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/download-artifact@v4
        with:
          pattern: notam-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        run: bun run scripts/checksums.ts --dir dist

      - name: Check dist/ holds exactly the five release assets
        run: |
          count=$(find dist -type f | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "Expected 5 files in dist/, found $count:" >&2
            ls -la dist >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/notam-darwin-arm64 \
            dist/notam-darwin-x64 \
            dist/notam-linux-x64 \
            dist/notam-linux-arm64 \
            dist/SHA256SUMS
