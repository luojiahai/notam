name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job, so a missing changeset is a red check in half a minute rather
  # than something buried behind Playwright. The version pull request is exempt
  # because it *spends* the changesets: it deletes every one of them while
  # editing package.json and CHANGELOG.md, and so would fail the gate that
  # Changesets itself asks for.
  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # `changeset status --since` exits 1 when packages changed and no
      # changeset says how. A pull request that truly changes nothing a user
      # could observe still declares that, with `bun run changeset --empty`.
      - name: Every change declares its release
        run: bun run changeset:status

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # install.sh and uninstall.sh are POSIX sh, not bash: the suites under
      # tests/install spawn `sh`, and ubuntu-latest's /bin/sh is dash, so this
      # is what actually proves both run under dash and not just bash-as-sh.
      - name: Server, web, and installer tests
        run: bun run test

      # Before Playwright: the end-to-end points the server at web/dist.
      - name: Build the web UI
        run: bun run build:web

      - name: Install Playwright's browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end
        run: bun run test:e2e

      - name: Compiled binary smoke test
        run: bun run test:binary

      # Spec section 13: build all four targets on every pull request, so
      # packaging breakage is caught before a tag depends on it. Runs through
      # the documented `build:binaries` alias so that alias is exercised too.
      - name: Build all four release targets
        run: bun run build:binaries --version 0.0.0-ci

      # Runs through the documented `checksums` alias so that alias is
      # exercised too.
      - name: Checksum them
        run: |
          bun run checksums
          ls -la dist

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
