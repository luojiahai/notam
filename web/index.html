<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Notes On Team Agreements & Methods" />
		<!--
			Both schemes are declared so form controls, scrollbars, and the
			canvas the browser paints before CSS arrives all match the theme.
		-->
		<meta name="color-scheme" content="light dark" />
		<title>NOTAM</title>
		<!--
			Applied before first paint, on purpose. Reading these from React would
			leave one frame of light chrome on a dark machine, and one frame of
			default-width sidebar for anyone who has resized theirs. That flash is
			the single most visible defect a themed app can ship.
			Kept in sync afterwards by web/src/lib/theme.ts and sidebar-width.ts.
		-->
		<script>
			var theme = null;
			var width = null;
			try {
				theme = localStorage.getItem("notam.theme");
				width = parseFloat(localStorage.getItem("notam.sidebar-width"));
			} catch {
				// Storage can be unavailable; the defaults still apply.
			}
			if (theme === "light" || theme === "dark") {
				document.documentElement.setAttribute("data-theme", theme);
			}
			// The stylesheet clamps this, so the bounds are not repeated here. A
			// nonsense value is dropped rather than written: the token is typed as
			// a length, and an invalid one would fall back past the default.
			if (Number.isFinite(width) && width > 0) {
				document.documentElement.style.setProperty(
					"--sidebar-w",
					`${width}px`,
				);
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
