name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Never cancel a run in progress: the release it may be part-way through would
# leave a tag with some of its assets. Runs queue instead.
concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  version:
    name: Open or update the version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.pending.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # With no publish-script the action only ever opens or updates the
      # "Version Packages" pull request; it creates no release and no tag.
      - id: changesets
        uses: changesets/action@v2.1.1
        with:
          version-script: bun run changeset:version
        env:
          # @changesets/changelog-github reads this to turn each changeset into
          # an entry carrying its pull request and author.
          GITHUB_TOKEN: ${{ github.token }}

      # A release is due when the changesets are spent — which is what merging
      # the version pull request does — and the version they were folded into
      # has not been released yet. Both halves matter: the first alone fires on
      # every quiet merge, the second alone fires before the changelog exists.
      # Asking GitHub rather than remembering also makes a half-finished
      # release retry on the next push instead of needing a hand-cut tag.
      - id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.changesets.outputs.has-changesets }}" = "true" ]; then
            echo "Changesets are still pending; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(jq -er .version package.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not released yet."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
